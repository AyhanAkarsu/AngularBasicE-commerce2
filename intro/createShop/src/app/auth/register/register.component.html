<form #userRegister="ngForm" (ngSubmit)="register(userRegister)">
    <div class="form-group">
        <label for="name">Kullanıcı Adı</label>
        <input #name="ngModel" type="text" name="name" id="name" [(ngModel)]="model.name" class="form-control" required>
        <div *ngIf="name.invalid && name.dirty" class="alert alert-danger">Bu alan gereklidir.</div>
    </div>
    <div class="form-group">
        <label for="password">Şifre</label>
        <input #password="ngModel" type="password" name="password" id="password" [(ngModel)]="model.password" class="form-control" required>
        <div *ngIf="password.invalid && password.dirty" class="alert alert-danger">Bu alan gereklidir.</div>
    </div>
    <button type="submit" class="btn btn-primary mt-1" [disabled]="userRegister.invalid">Kayıt Ol</button>
</form>
