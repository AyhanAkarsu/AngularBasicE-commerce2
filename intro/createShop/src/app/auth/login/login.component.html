<form #userRegister="ngForm" (ngSubmit)="login(userRegister)">
    <div class="form-group">
        <label for="name">Kullanıcı Adı</label>
        <input type="text" name="name" id="name" #name="ngModel" [(ngModel)]="model.name" class="form-control">
    </div>
    <div class="form-group">
        <label for="password">Şifre</label>
        <input type="password" name="password" id="password" #password="ngModel" [(ngModel)]="model.password" class="form-control">
    </div>
    <button type="submi" class="btn btn-success mt-1">Giriş Yap</button>
</form>
